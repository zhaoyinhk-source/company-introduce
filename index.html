<head>

  <title>LUMIST | Institutional-Grade AI Inference & Multi-Route API Infrastructure</title>

  <style>
    :root {
      --bg-primary: #06080c;
      --bg-secondary: #0c1017;
      --bg-card: rgba(16, 21, 30, 0.72);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(249, 115, 22, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --solar-orange: #f97316;
      --solar-red: #dc2626;
      --solar-amber: #fb923c;
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    code, pre, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Subtle Institutional Grid Background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 30%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Solar / Photon Corona Glow */
    .solar-orb {
      position: absolute;
      top: -140px;
      right: -80px;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, 
        rgba(251, 146, 60, 0.42) 0%, 
        rgba(249, 115, 22, 0.24) 32%, 
        rgba(220, 38, 38, 0.12) 58%, 
        transparent 75%);
      filter: blur(48px);
      pointer-events: none;
      z-index: 0;
      animation: coronaPulse 9s ease-in-out infinite alternate;
    }

    @keyframes coronaPulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.85; }
      100% { transform: scale(1.08) translate(-18px, 14px); opacity: 1; }
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Navigation */
    header {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(6, 8, 12, 0.82);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .photon-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fdba74, #f97316 55%, #b91c1c 100%);
      box-shadow: 0 0 18px rgba(249, 115, 22, 0.65), 0 0 36px rgba(220, 38, 38, 0.3);
      position: relative;
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.14em;
    }

    .brand-tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
      letter-spacing: 0.06em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.28);
    }

      box-shadow: 0
